name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Ein neuer Push auf einen PR bricht dessen laufenden Build ab. Builds auf
# main und bei Tags bekommen je eine eigene Gruppe und laufen immer zu Ende,
# damit kein Release ausfällt.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # OpenSSL statisch (mit dynamischer C-Laufzeit wie Rust) aus vcpkg
  VCPKG_TRIPLET: x64-windows-static-md

jobs:
  # Prüfungen, Tests und Installer in einem Lauf: Windows-Minuten zählen in
  # privaten Repos doppelt, und baresip/OpenSSL sollen nur einmal bauen.
  windows:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # baresip, re, libg722 und StarCLX (für die .proto-Dateien)
          submodules: true

      - name: OpenSSL aus dem Cache
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed/${{ env.VCPKG_TRIPLET }}
          key: openssl-${{ env.VCPKG_TRIPLET }}-v1

      - name: OpenSSL bauen (vcpkg)
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: vcpkg install "openssl:$VCPKG_TRIPLET"

      - name: OpenSSL bekannt machen
        run: echo "OPENSSL_DIR=C:/vcpkg/installed/$VCPKG_TRIPLET" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Nur main speichert; PRs nutzen dessen Cache
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Oberfläche prüfen
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm run i18n:check

      - name: Formatierung
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Test gegen die Windows-Anmeldeinformationsverwaltung
        run: cargo test -p sf-auth --test system_keyring -- --ignored

      # Release: der erste Build auf main mit einer neuen Version in Cargo.toml
      # (oder ein Tag v1.2.3 mit genau dieser Version). Alle anderen Builds
      # hängen die Laufnummer an (0.1.0+123).
      - name: Version setzen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          RELEASE=0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$BASE" ]; then
              echo "::error::Tag $GITHUB_REF_NAME passt nicht zu Cargo.toml ($BASE)"
              exit 1
            fi
            RELEASE=1
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
              && ! gh release view "v$BASE" >/dev/null 2>&1; then
            VERSION="$BASE"
            RELEASE=1
          else
            VERSION="$BASE+${{ github.run_number }}"
          fi
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json
          grep -m1 '^version' Cargo.toml
          grep '"version"' apps/desktop/src-tauri/tauri.conf.json

      - name: Installer bauen (NSIS)
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - name: sfctl bauen
        run: cargo build --release -p sfctl

      - uses: actions/upload-artifact@v7
        with:
          name: starcmx-${{ env.VERSION }}-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/sfctl.exe

  release:
    needs: windows
    if: needs.windows.outputs.release == '1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: starcmx-${{ needs.windows.outputs.version }}-windows-x64
          path: dl
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dl/sfctl.exe "sfctl-${VERSION}-windows-x64.exe"
          # Abschnitt dieser Version aus CHANGELOG.md als Release-Text
          awk -v v="## $VERSION" '$0 ~ "^## " {p = index($0, v) == 1} p' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --latest --target "$GITHUB_SHA" --title "StarCMX $VERSION" --notes-file notes.md \
            dl/bundle/nsis/*.exe \
            "sfctl-${VERSION}-windows-x64.exe"
