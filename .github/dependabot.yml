# Wöchentliche Updates, je Bereich ein Sammel-PR für Minor- und Patch-Versionen;
# Major-Versionen kommen einzeln, weil sie eher Anpassungen brauchen.
# Die Submodule unter crates/sf-sip/vendor bleiben bewusst aussen vor.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # zbus 6 entfernt die blocking-API, auf der die Linux-Teile der
      # Desktop-App aufbauen; Tauri, notify-rust und secret-service hängen
      # noch an zbus 5. Der Umstieg braucht eine eigene Portierung.
      - dependency-name: zbus
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 erst, wenn @sveltejs/kit und svelte-check es als
      # Peer-Abhängigkeit zulassen; bis dahin bricht npm ci ab (ERESOLVE).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
